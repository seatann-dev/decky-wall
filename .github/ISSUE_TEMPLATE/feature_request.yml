name: Feature idea
description: Suggest something new or a better way to do something.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Decky.wall to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do, and what's in the way today?
  - type: input
    id: version
    attributes:
      label: Decky.wall version (optional)
      placeholder: "3.2.2"
